# OS V01D Wayland. Hyprland. Black, cobalt, uranium. Fast.
monitor=,preferred,auto,1

env = XCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,OSV01D
env = XDG_SESSION_TYPE,wayland

general {
  gaps_in = 6
  gaps_out = 10
  border_size = 1
  col.active_border = rgb(e6ff2a) rgb(0047ab) 45deg
  col.inactive_border = rgb(050506)
  layout = dwindle
}

decoration {
  rounding = 10
  blur {
    enabled = true
    size = 8
    passes = 2
  }
}

animations {
  enabled = true
  bezier = v01d, 0.22, 1, 0.36, 1
  animation = windows, 1, 3, v01d
  animation = fade, 1, 3, v01d
  animation = workspaces, 1, 4, v01d
}

input {
  kb_layout = us
  follow_mouse = 1
}

bind = SUPER, Return, exec, foot
bind = SUPER, Q, killactive,
bind = SUPER, E, exec, osv01d
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4

exec-once = pipewire
exec-once = osv01d
