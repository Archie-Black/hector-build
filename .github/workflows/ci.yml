name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node 22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: node -v
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  rust:
    name: WASM vector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip1
      - run: cargo build --release --manifest-path crates/hx-vector/Cargo.toml
      - run: cargo build --release --target wasm32-unknown-unknown --manifest-path crates/hx-vector/Cargo.toml
      - run: cargo build --release --target wasm32-wasip1 --manifest-path crates/hx-vector/Cargo.toml
