name: pre-commit autoupdate

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pre-commit-autoupdate
  cancel-in-progress: true

jobs:
  autoupdate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      - run: pre-commit autoupdate
      - name: Open a PR if revs moved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "hector-hooks"
          git config user.email "hooks@users.noreply.github.com"
          git add .pre-commit-config.yaml
          if git diff --cached --quiet; then
            echo "revs unchanged"
            exit 0
          fi
          git switch -C hooks/autoupdate
          git commit -m "pre-commit autoupdate"
          git push -u origin hooks/autoupdate --force
          gh pr view hooks/autoupdate >/dev/null 2>&1 || gh pr create --base main --head hooks/autoupdate --title "pre-commit autoupdate" --body "Weekly rev bump. Review, then merge."
