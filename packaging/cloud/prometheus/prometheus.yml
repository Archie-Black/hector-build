global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: osv01d

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["10.13.0.42:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
  - job_name: alertmanager
    static_configs:
      - targets: ["10.13.0.42:9093"]
  - job_name: vector
    static_configs:
      - targets: ["10.13.0.30:9598"]
  - job_name: traefik
    metrics_path: /metrics
    static_configs:
      - targets: ["10.13.0.2:8082"]
  - job_name: cadvisor
    static_configs:
      - targets: ["10.13.0.41:8080"]
  - job_name: node
    static_configs:
      - targets: ["10.13.0.44:9100"]
  - job_name: otel
    static_configs:
      - targets: ["10.13.0.45:8889"]
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_site]
    static_configs:
      - targets:
          - http://v01d:8080/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 10.13.0.43:9115
