name: osv01d

networks:
  fabric:
    name: v01d_fabric
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.13.0.0/24
  edge:
    name: v01d_edge
    driver: bridge

volumes:
  acme:
  pg:
  prom:
  oteldata:

services:
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    networks:
      edge: {}
      fabric:
        ipv4_address: 10.13.0.2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - acme:/letsencrypt
    environment:
      - TZ=UTC
    depends_on:
      v01d:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  v01d:
    build:
      context: ../..
      dockerfile: packaging/cloud/Dockerfile
    restart: unless-stopped
    networks:
      fabric: {}
    expose:
      - "8080"
    env_file:
      - .env
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      DATABASE_URL: postgres://${PG_USER}:${PG_PASS}@10.13.0.20:5432/${PG_DB}
      OTEL_SERVICE_NAME: osv01d
      OTEL_EXPORTER_OTLP_ENDPOINT: http://10.13.0.45:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/json
    depends_on:
      timescale:
        condition: service_healthy
      otel:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1G
        reservations:
          memory: 256M

  timescale:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    networks:
      fabric:
        ipv4_address: 10.13.0.20
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASS}
      POSTGRES_DB: ${PG_DB}
    volumes:
      - pg:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-v01d.sql:ro
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  vector:
    image: timberio/vector:0.44.0-alpine
    restart: unless-stopped
    networks:
      fabric:
        ipv4_address: 10.13.0.30
    volumes:
      - ./vector/vector.toml:/etc/vector/vector.toml:ro
    environment:
      PG_USER: ${PG_USER}
      PG_PASS: ${PG_PASS}
      PG_DB: ${PG_DB}
    depends_on:
      timescale:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8686/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    networks:
      fabric:
        ipv4_address: 10.13.0.40
    expose:
      - "9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prom:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.listen-address=0.0.0.0:9090
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    restart: unless-stopped
    networks:
      fabric:
        ipv4_address: 10.13.0.41
    expose:
      - "8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    command:
      - --housekeeping_interval=15s
      - --docker_only=true
    deploy:
      resources:
        limits:
          memory: 192M

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    networks:
      fabric:
        ipv4_address: 10.13.0.42
    expose:
      - "9093"
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --web.listen-address=0.0.0.0:9093
      - --storage.path=/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9093/-/healthy"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  blackbox:
    image: prom/blackbox-exporter:v0.26.0
    restart: unless-stopped
    networks:
      fabric:
        ipv4_address: 10.13.0.43
    expose:
      - "9115"
    volumes:
      - ./prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - --config.file=/etc/blackbox_exporter/config.yml

  node:
    image: prom/node-exporter:v1.9.0
    restart: unless-stopped
    pid: host
    networks:
      fabric:
        ipv4_address: 10.13.0.44
    expose:
      - "9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - ./metrics:/textfile:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.textfile.directory=/textfile
      - --web.listen-address=0.0.0.0:9100

  otel:
    image: otel/opentelemetry-collector-contrib:0.143.0
    restart: unless-stopped
    networks:
      fabric:
        ipv4_address: 10.13.0.45
    expose:
      - "4317"
      - "4318"
      - "8889"
      - "13133"
    volumes:
      - ./otel/collector.yml:/etc/otelcol-contrib/config.yaml:ro
      - oteldata:/var/lib/otel
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:13133/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M

  mesh:
    image: alpine:3.21
    restart: unless-stopped
    profiles: ["wireguard"]
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      edge: {}
      fabric:
        ipv4_address: 10.13.0.3
    ports:
      - "51820:51820/udp"
    volumes:
      - ./wireguard:/etc/wireguard:ro
    command:
      - /bin/sh
      - -c
      - apk add --no-cache wireguard-tools && wg-quick up wg0 && sleep infinity
