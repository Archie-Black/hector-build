name: sentinel

networks:
  fabric:
    name: v01d_fabric
    external: true

services:
  ollama:
    image: ollama/ollama:0.6.5
    restart: unless-stopped
    networks:
      fabric: {}
    expose:
      - "11434"
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 10m
    deploy:
      resources:
        limits:
          memory: 8G
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  vllm:
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    profiles: ["vllm"]
    networks:
      fabric: {}
    expose:
      - "8000"
    environment:
      HUGGING_FACE_HUB_TOKEN: ""
    command:
      - --model
      - Qwen/Qwen2.5-7B-Instruct
      - --max-model-len
      - "4096"
      - --gpu-memory-utilization
      - "0.85"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama:
