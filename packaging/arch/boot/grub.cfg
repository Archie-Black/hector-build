# OS V01D. No menu. Timeout 0. Install.
set timeout=0
set default=0
menuentry "OS V01D" {
  linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=4G systemd.unit=osv01d-install.service quiet splash
  initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
}
