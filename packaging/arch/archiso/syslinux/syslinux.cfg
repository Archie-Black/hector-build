# OS V01D. USB or netboot. No loader menu. Install starts. DeltaKingZero.
DEFAULT osv01d
PROMPT 0
TIMEOUT 0
ONTIMEOUT osv01d

LABEL osv01d
  LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
  INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
  APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=4G systemd.unit=osv01d-install.service quiet splash
